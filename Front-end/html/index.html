<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
<title>Criart</title>
</head>
<body>

<header>
  <div class="logo">
      <img src="/img/logo-criart.png" alt="logo criart" width="80">
  </div>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Sobre nós</a></li>
      <li><a href="#">Eventos</a></li>
      <li><a href="#">Doações</a></li>
    </ul>
  </nav>

  <div class="header-container">
    <div class="search-bar">
      <svg class="icon-search" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
       <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Pesquisar">
    </div>

    <div class="profile-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
    </div>
  </div>
</header>

<section class="hero-section">
  <div class="container-hero">
      
      <div class="hero-text">
        <h1>Vem ser 
            <span class="c-blue">C</span><span class="c-orange">R</span><span class="c-gray">I</span><span class="c-yellow">A</span><span class="c-green">R</span><span class="c-dblue">T</span>
        </h1>
        <p>Somos um espaço de arte, jogos e eventos dedicado a fazer a infância mais feliz e colorida.
          Conheça nossos projetos e junte-se a nós!
        </p>
        <button class="btn-ver">Ver mais</button>
      </div>
      
      <div class="hero-image">
          <img src="/img/fotos-crianças-criart.png" alt="crianças criart">
      </div>

  </div>

  <div class="wave-container">
    <svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ffffff" fill-opacity="1" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,261.3C960,256,1056,224,1152,208C1248,192,1344,192,1392,192L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
     </svg> 
  </div>
</section>

</body>
<script src="../js/javascript.js"></script>
</html>
